# Contoh file setelan. Salin menjadi clients.toml (tidak ikut git), lalu
# sesuaikan.
#
# File setelan TIDAK memuat rahasia. API key dibaca dari environment; di sini
# hanya disebut NAMA variabelnya.

# Folder antrian lokal: satu file SQLite per client. Jalur relatif dihitung
# dari letak file setelan ini.
data_dir = "data"

# Kiriman yang sudah sampai di Odoo disimpan sekian hari, lalu dihapus.
# Yang belum sampai tidak pernah dihapus.
keep_sent_days = 3

# Seberapa sering (detik) memeriksa apakah akunnya sedang siaran.
poll_seconds = 60

[[client]]
# Kode client. Dipakai sebagai nama file antrian.
code = "demo"
# Username akun TikTok yang siarannya diikuti, tanpa '@'.
tiktok = "nama_akun"
# Alamat dasar Odoo.
odoo_url = "http://localhost:8069"
# Header X-Odoo-Database. Hapus kalau Odoo hanya punya satu database.
odoo_db = "demo"
# Header Host. Isi kalau Odoo memilih database dari nama host tetapi dipanggil
# lewat alamat lain.
# odoo_host = "demo.example.com"
# Nama variabel environment berisi API key user bot. Kalau baris ini dihapus,
# namanya BRIDGE_KEY_<KODE>, di sini BRIDGE_KEY_DEMO.
api_key_env = "BRIDGE_KEY_DEMO"

# Client berikutnya tinggal menambah blok. Tiap client punya antrian dan API
# key sendiri.
# [[client]]
# code = "demo2"
# tiktok = "akun_lain"
# odoo_url = "http://localhost:8069"
# odoo_db = "demo2"
